<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!---counting by increasing and decreasing.---->
<section>

  <h3>counting</h3>
   <label id="countLabel">0</label>

   <div id="btnContainer">
   <button id="decreaseBtn" class="buttons">decrease</button>
   <button id="resetBtn" class="buttons">reset</button>
   <button id="increaseBtn" class="buttons">increase</button>
   </div>

</section>

<!---generating random numbers---->
<section>
    <h3>generate 3 random number</h3>
  <button id="randomBtn">generate</button> <br> <br>
  <label id="label1" class="labels"></label>
  <label id="label2" class="labels" ></label>
  <label id="label3" class="labels"></label>
</section>


<!---If statements in Age----->
<section>
   <h3>Age checker</h3>
   <label>Enter Age:</label>
   <input type="text" id="myAge"> 
    <button id="ageBtn">submit</button>
   <p id="myText"></p>
</section>

<!---checked property in checkbox, and radio buttons elements-->
  <section>
     <h3>Checked property</h3>
     <input type="radio" id="betaSquad" name="radio">
     <label for="betaSquad">Beta Squad</label> <br> 
     <input type="radio" id="sideMen" name="radio">
     <label for="sideMen">SideMen</label> <br> 
     <input type="radio" id="mrBeast" name="radio">
     <label for="mrBeast">Mr. Beast</label> <br> <br>

     <input type="checkbox" id="subscBox">
     <label for="subscBox">Subscribe</label> <br>

     <button id="checkBtn">Submit</button>
     <p id="checkText"></p>
     <p id="subsText"></p>

  </section>

    <script src="script.js"></script>
</body>
</html>
